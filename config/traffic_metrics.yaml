input:
  source: "C:\\Users\\hamza\\Datasets\\TrafficDatasets\\IMAROC_2\\kech38.mp4"
  fps: 30


frame_processing:
  producer: "direct"     # direct | sampled_offline | realtime_simulation

  sampling:
    enabled: false
    policy: "every_frame"
    stride: 1


timing:
  mode: "frame"          # frame | unix


analytics:
  period_seconds: 300
  max_obs_per_frame: 50


continuity:
  enabled: true
  max_age_seconds: 30


homography:
  enabled: false
  calibration_file: null


detector:
  model_name: "yolo11n_finetuned"
  confidence: 0.50


tracker:
  method: "ocsort"
  reid_model: "osnet_x0_25_market1501.pt"
  classes: null
  device: "cuda"
  half: true
  per_class: true


geometry:
  coordinate_space: "image"      # image | world | auto
  frame_size_reference: 1000
  polygon_membership_mode: "center"

  vicinity:
    image: 0.15
    world_m: 2

  lines:
    - line_id: "line_1"
      points: [[1905, 365], [9, 687]]

    - line_id: "line_2"
      points: [[11, 506], [917, 768]]

    - line_id: "line_3"
      points: [[1675, 361], [2, 521]]

  areas:
    - area_id: "area_1"
      area_type: "lane"          # lane | direction | mixed | entire
      enabled: true
      zone:
        points: [[988, 66], [1207, 32], [1909, 544], [1914, 1056], [1653, 1058]]
        distance_meters: 8
      flow_line_id: "line_1"

    - area_id: "area_2"
      area_type: "lane"
      enabled: true
      zone:
        points: [[988, 87], [826, 96], [1067, 1058], [1655, 1060]]
        distance_meters: 8
      flow_line_id: "line_1"

    - area_id: "area_3"
      area_type: "lane"
      enabled: true
      zone:
        points: [[962, 1056], [798, 119], [576, 111], [297, 1065]]
        distance_meters: 8
      flow_line_id: "line_1"

    - area_id: "area_4"
      area_type: "lane"
      enabled: true
      zone:
        points: [[567, 141], [60, 13], [2, 634], [2, 1067], [292, 1067]]
        distance_meters: 8
      flow_line_id: "line_1"

    - area_id: "area_5"
      area_type: "entire"
      enabled: true
      flow_line_id: "line_1"


metrics:
  flow:
    enabled: true
    spatial_scope: "any_area"
    coordinate_requirement: "image_or_world"
    counter:
      logic: "crossed_or_vicinity"

  density:
    enabled: true
    spatial_scope: "any_area"
    coordinate_requirement: "world_required"

  space_occupancy:
    enabled: true
    spatial_scope: "any_area"
    coordinate_requirement: "world_required"

  time_occupancy:
    enabled: true
    spatial_scope: "any_area"
    coordinate_requirement: "image_or_world"

  space_headway:
    enabled: true
    spatial_scope: "lane_only"
    coordinate_requirement: "world_required"

  time_headway:
    enabled: true
    spatial_scope: "lane_only"
    coordinate_requirement: "image_or_world"

  speed:
    enabled: true
    spatial_scope: "any_area"
    coordinate_requirement: "world_required"
